name: News Bot Run

on:
  schedule:
    # Run at minutes 7, 22, 37, 52 of every hour (≈ every 15 min, offset to avoid the rush)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no messages sent)"
        type: boolean
        default: false
      force_digest:
        description: "Force compiling and dispatching digest regardless of schedule"
        type: boolean
        default: false
      crypto_news:
        description: "Force compiling and dispatching crypto day-trading intelligence report"
        type: boolean
        default: false
      markets_news:
        description: "Force compiling and dispatching business & market intelligence report"
        type: boolean
        default: false
      world_news:
        description: "Force compiling and dispatching world & geopolitical intelligence report"
        type: boolean
        default: false
      india_news:
        description: "Force compiling and dispatching India national news intelligence report"
        type: boolean
        default: false
  repository_dispatch:
    types: [news_run, telegram_command]

concurrency:
  group: news-bot-run
  cancel-in-progress: false

permissions:
  contents: write  # needed for state branch commits

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: TELEGRAM_BOT_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch state branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin state:refs/heads/state || true

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          DIGEST_TIMES: ${{ secrets.DIGEST_TIMES }}
          QUIET_HOURS: ${{ secrets.QUIET_HOURS }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          FORCE_DIGEST: ${{ inputs.force_digest || github.event.client_payload.force_digest || false }}
          FORCE_CRYPTO: ${{ inputs.crypto_news || github.event.client_payload.crypto_news || false }}
          FORCE_MARKETS: ${{ inputs.markets_news || github.event.client_payload.markets_news || false }}
          FORCE_WORLD: ${{ inputs.world_news || github.event.client_payload.world_news || false }}
          FORCE_INDIA: ${{ inputs.india_news || github.event.client_payload.india_news || false }}
          DISPATCH_COMMAND: ${{ github.event.client_payload.command || '' }}
        run: |
          if [ "${{ inputs.dry_run || github.event.client_payload.dry_run }}" = "true" ]; then
            python -m src.bot --dry-run
          else
            python -m src.bot
          fi

      - name: Push state branch
        if: always()
        run: |
          git push origin refs/heads/state:refs/heads/state --force || true
