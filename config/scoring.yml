# Scoring weights and thresholds — tune these for your preferences.

trust_weights:
  official: 1.0
  major: 0.8
  specialist: 0.6
  aggregator: 0.4

recency:
  decay_hours: 6
  # Linear decay: score = max(0, 1 - age_hours / decay_hours)

cluster:
  log_boost_per_source: 0.15
  max_boost: 0.5

watchlist:
  hit_boost: 0.3

breaking_keywords:
  world:
    - ceasefire
    - sanctions
    - invasion
    - coup
    - assassination
    - nuclear
    - emergency
    - martial law
    - war
    - airstrike
    - missiles
    - treaty
    - summit
    - un security council
    - nato
    - bilateral
    - diplomacy
    - embassy
    - military exercise
    - conflict
    - hostage
    - terror attack
    - border clash
    - escalation
    - peace talks
    - ballistic
    - sovereignty
    - annex
    - offensive
    - airspace
  india:
    - emergency
    - curfew
    - parliament
    - supreme court
    - election result
    - lok sabha
    - rajya sabha
    - cabinet
    - prime minister
    - modi
    - president
    - high court
    - isro
    - army
    - navy
    - air force
    - border
    - bilateral
    - kashmir
    - ladakh
    - ordinance
    - governor
    - cbi
    - ed
    - nia
    - bill passed
    - assembly
    - bypoll
  business:
    - rate decision
    - rate cut
    - rate hike
    - default
    - bailout
    - recession
    - gdp
    - inflation
    - cpi
    - ppi
    - jobs report
    - unemployment
    - central bank intervention
    - treasury
    - trade deficit
    - tariffs
    - layoffs
    - debt ceiling
    - bond yields
    - fiscal
    - merger
    - acquisition
  markets:
    - trading halt
    - circuit breaker
    - flash crash
    - ipo
    - earnings
    - margin call
    - rally
    - slump
    - selloff
    - plunge
    - surge
    - all-time high
    - record high
    - shares surge
    - shares jump
    - shares tumble
    - bull market
    - bear market
    - s&p 500
    - nasdaq
    - dow jones
    - quarterly results
    - revenue beats
    - revenue misses
  crypto:
    - hack
    - exploit
    - depeg
    - sec
    - etf approved
    - rug pull
    - fork

breaking_keyword_boost: 0.4

penalty_patterns:
  - pattern: "(?i)\\bopinion\\b"
    penalty: 0.3
  - pattern: "(?i)\\bsponsored\\b"
    penalty: 0.5
  - pattern: "(?i)\\b\\d+ (things|ways|reasons|tips)\\b"
    penalty: 0.2
  - pattern: "(?i)\\brecap\\b"
    penalty: 0.15

thresholds:
  breaking: 0.75
  digest: 0.35

per_run_caps:
  breaking_max: 8
