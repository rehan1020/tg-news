# Default news sources — upstream neutral defaults.
# Adopters: create config/sources.local.yml to override (gitignored).
# Do NOT edit this file in your fork; it will cause merge conflicts on upgrade.

sources:
  # --- World / Geopolitics ---
  - id: bbc_world
    name: BBC World News
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    sector: world
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: aljazeera
    name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    sector: world
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: dw_world
    name: DW News
    url: https://rss.dw.com/rdf/rss-en-all
    sector: world
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: guardian_world
    name: The Guardian - World
    url: https://www.theguardian.com/world/rss
    sector: world
    trust_tier: major
    extract_mode: api
    enabled: true
    notes: Full content via Guardian Open Platform API (requires GUARDIAN_API_KEY)

  - id: nyt_world
    name: NYT Top Stories - World
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    sector: world
    trust_tier: major
    extract_mode: rss_only
    enabled: true
    notes: Full text paywalled; RSS snippet only

  # --- India National ---
  - id: thehindu
    name: The Hindu - National
    url: https://www.thehindu.com/news/national/feeder/default.rss
    sector: india
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: pib
    name: Press Information Bureau
    url: https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3
    sector: india
    trust_tier: official
    extract_mode: full
    enabled: true

  - id: indianexpress
    name: Indian Express
    url: https://indianexpress.com/section/india/feed/
    sector: india
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: livemint
    name: Mint
    url: https://www.livemint.com/rss/news
    sector: india
    trust_tier: major
    extract_mode: full
    enabled: true

  - id: economictimes
    name: Economic Times
    url: https://economictimes.indiatimes.com/rssfeedstopstories.cms
    sector: india
    trust_tier: major
    extract_mode: full
    enabled: true

  # --- Business / Macro ---
  - id: fed_press
    name: Federal Reserve Press Releases
    url: https://www.federalreserve.gov/feeds/press_all.xml
    sector: business
    trust_tier: official
    extract_mode: full
    enabled: true

  - id: ecb_press
    name: ECB Press Releases
    url: https://www.ecb.europa.eu/rss/press.html
    sector: business
    trust_tier: official
    extract_mode: full
    enabled: true

  - id: rbi_press
    name: RBI Press Releases
    url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?output=rss
    sector: business
    trust_tier: official
    extract_mode: full
    enabled: true
    notes: URL to be verified in Phase 1

  - id: sebi_press
    name: SEBI Press Releases
    url: https://www.sebi.gov.in/sebiweb/home/HomeRss.jsp?contentType=PressRelease
    sector: business
    trust_tier: official
    extract_mode: full
    enabled: true
    notes: URL to be verified in Phase 1

  - id: imf_news
    name: IMF News
    url: https://www.imf.org/en/News/rss
    sector: business
    trust_tier: official
    extract_mode: full
    enabled: true
    notes: URL to be verified in Phase 1

  # --- Markets / Day Trading ---
  - id: yahoo_finance
    name: Yahoo Finance
    url: https://finance.yahoo.com/news/rssindex
    sector: markets
    trust_tier: specialist
    extract_mode: rss_only
    enabled: true
    notes: URL to be verified in Phase 1

  - id: finnhub
    name: Finnhub Market News
    url: api://finnhub/news
    sector: markets
    trust_tier: specialist
    extract_mode: api
    enabled: true
    notes: Requires FINNHUB_API_KEY; API-based source

  - id: alphavantage
    name: Alpha Vantage News Sentiment
    url: api://alphavantage/news
    sector: markets
    trust_tier: specialist
    extract_mode: api
    enabled: false
    notes: Requires ALPHAVANTAGE_API_KEY; disabled by default

  # --- Crypto ---
  - id: coindesk
    name: CoinDesk
    url: https://www.coindesk.com/arc/outboundfeeds/rss/
    sector: crypto
    trust_tier: specialist
    extract_mode: full
    enabled: true

  - id: cointelegraph
    name: Cointelegraph
    url: https://cointelegraph.com/rss
    sector: crypto
    trust_tier: specialist
    extract_mode: full
    enabled: true

  - id: theblock
    name: The Block
    url: https://www.theblock.co/rss.xml
    sector: crypto
    trust_tier: specialist
    extract_mode: rss_only
    enabled: true
    notes: May have partial paywall; RSS snippet preferred

  - id: cryptopanic
    name: CryptoPanic
    url: api://cryptopanic/posts
    sector: crypto
    trust_tier: aggregator
    extract_mode: api
    enabled: false
    notes: Requires CRYPTOPANIC_API_KEY; aggregator tier; disabled by default

  # --- Discovery / Aggregator ---
  - id: gdelt
    name: GDELT Project
    url: https://api.gdeltproject.org/api/v2/doc/doc?query=&mode=ArtList&format=rss
    sector: world
    trust_tier: aggregator
    extract_mode: rss_only
    enabled: false
    notes: Aggregator; disabled by default

  - id: google_news
    name: Google News
    url: https://news.google.com/rss
    sector: world
    trust_tier: aggregator
    extract_mode: rss_only
    enabled: false
    notes: Disabled by default pending ToS review at scale
